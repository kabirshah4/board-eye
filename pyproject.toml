[project]
name = "chessbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thanosthings", email = "goofygaming45@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
chessbot = "chessbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
